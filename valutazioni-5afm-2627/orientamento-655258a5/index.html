<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Orientamento · accesso</title>
<style>
:root{--bg:#f6f2ea;--card:#fffdf8;--ink:#1d2433;--mute:#5a6273;--line:#e2dccf;--acc:#0f6b6b;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#11161f;--card:#1a2232;--ink:#e8ecf3;--mute:#9aa4b5;--line:#2f394b;--acc:#6fc7c0;--err:#ff8f85;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:400px}
.ey{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
h1{font-size:1.4rem;margin:0 0 18px}
label{display:block;font-weight:700;margin:0 0 6px}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 16px}
button{width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.5em;margin:12px 0 0}.msg.err{color:var(--err)}
.hint{color:var(--mute);font-size:.85rem;margin:-10px 0 16px}
</style>
</head>
<body>
<div class="card">
<p class="ey">Orientamento · 5ª AFM</p>
<h1>Dove studiare dopo la maturità</h1>
<form id="f" autocomplete="off">
<label for="n">Numero di registro</label>
<input id="n" inputmode="numeric" required>
<label for="c">Codice: giorno e mese di nascita</label>
<input id="c" inputmode="numeric" placeholder="gg/mm" required>
<p class="hint">Lo stesso codice del sito delle valutazioni</p>
<button id="b" type="submit">Apri</button>
</form>
<p id="m" class="msg" role="status"></p>
</div>
<script>
const CFG={"iter": 600000, "iv": "7AkICiVqtVv7kTTo", "keys": {"7": {"k": "+z7+P91eXrDc1gtNfR17wHLBL45F9p3z2ynh9c3l/YEllPIud1WcVgHgs+/AgTrl", "i": "e9O+bwAgbkuXa5QE"}, "21": {"k": "FWEih8VPBej35BMYRlKUKr1SHtYbhEk1mfKMnDpB2hSOMSGabuikIq3i2fRpak82", "i": "iK1TRQ5asFTJvnvb"}}};
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function say(t,c){$('m').textContent=t;$('m').className='msg '+(c||'')}
function norms(s){const d=s.match(/\d+/g)||[],ok=(g,m)=>g>=1&&g<=31&&m>=1&&m<=12,c=(g,m)=>String(g).padStart(2,'0')+String(m).padStart(2,'0'),out=[];
 if(d.length>=2){if(ok(+d[0],+d[1]))out.push(c(d[0],d[1]))}
 else if(d.length==1){const t=d[0];
  if(t.length==4||t.length==6||t.length==8){if(ok(+t.slice(0,2),+t.slice(2,4)))out.push(t.slice(0,4))}
  else if(t.length==3){if(ok(+t.slice(0,2),+t.slice(2)))out.push(c(t.slice(0,2),t.slice(2)));if(ok(+t.slice(0,1),+t.slice(1)))out.push(c(t.slice(0,1),t.slice(1)))}
  else if(t.length==2&&ok(+t[0],+t[1]))out.push(c(t[0],t[1]))}
 return [...new Set(out)]}
if(location.protocol==='file:')say('Questa pagina funziona solo online.','err');
$('f').addEventListener('submit',async ev=>{ev.preventDefault();
 const n=String(parseInt($('n').value,10)),codes=norms($('c').value);
 if(!codes.length){say('Scrivi giorno e mese, per esempio 16/09 oppure 1609.','err');return}
 const w=CFG.keys[n];
 $('b').disabled=true;say('Apertura in corso…');
 try{
  const D=await (await fetch('../valutazioni.json',{cache:'no-store'})).json();
  let K=null;
  if(w&&D.sali[n])for(const code of codes){
   const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
   const kk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.sali[n]),iterations:CFG.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   try{K=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.i)},kk,b64(w.k));break}catch(_){}}
  if(!K){say('Accesso non consentito.','err');return}
  const key=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const enc=await (await fetch('c.bin',{cache:'no-store'})).arrayBuffer();
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},key,enc));
  document.open();document.write(html);document.close();
 }catch(_){say('Non riesco ad aprire la pagina. Riprova tra poco.','err')}finally{const b=$('b');if(b)b.disabled=false}});
</script>
</body>
</html>
