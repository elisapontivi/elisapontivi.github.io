<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valutazioni 5ª AFM 2026/27</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1c2433;--mute:#5d6676;--line:#d6dde8;--grid:#e3e9f3;--acc:#1e4fa3;--err:#b42318;--ok:#1f7a43;--soft:#eef3fb}
@media (prefers-color-scheme:dark){:root{--bg:#121722;--card:#1a2232;--ink:#e8ecf3;--mute:#9aa4b5;--line:#2f394b;--grid:#1c2433;--acc:#8db3ff;--err:#ff8f85;--ok:#7fd3a0;--soft:#1c2840;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border-bottom:1px solid var(--line)}
.w{max-width:480px;margin:0 auto;padding:0 16px}
header .w{padding-top:32px;padding-bottom:22px}
.ey{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
h1{font-size:1.6rem;margin:0}
main .w{padding-top:22px;padding-bottom:40px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-weight:700;margin:0 0 6px}
select,input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 16px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{color:var(--mute);font-size:.85rem;margin:-10px 0 16px}
button{width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.5em;margin:12px 0 0}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
h2{font-size:1.05rem;margin:0 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
li span{min-width:0}
li a{flex:none;font-weight:700;color:var(--acc);text-decoration:none;border:1px solid var(--acc);border-radius:8px;padding:6px 10px}
.out{background:none;color:var(--acc);border:0;padding:6px;width:auto;font-weight:600}
.foot{color:var(--mute);font-size:.82rem;margin:0}
</style>
</head>
<body>
<header><div class="w"><p class="ey">Economia Aziendale · a.s. 2026/27</p><h1>Valutazioni 5ª AFM</h1></div></header>
<main><div class="w">
<div class="card" id="login">
<form id="f" autocomplete="off">
<label for="n">Numero di registro</label>
<select id="n" required><option value="">Scegli il tuo numero</option></select>
<label for="c">Codice: giorno e mese di nascita</label>
<input id="c" inputmode="numeric" placeholder="gg/mm" required>
<p class="hint">Per esempio 05/03</p>
<button id="b" type="submit">Vedi le mie valutazioni</button>
</form>
<p id="m" class="msg" role="status"></p>
</div>
<div class="card" id="list" hidden>
<h2 id="lt"></h2>
<ul id="ul"></ul>
<p id="none" class="foot" hidden>Non ci sono ancora valutazioni per te.</p>
<button class="out" id="out" type="button">Esci</button>
</div>
<p class="foot">Ogni file contiene voto, griglia di valutazione, commento e foto della verifica con gli errori segnati. I file sono cifrati: senza il codice giusto non si possono aprire.</p>
</div></main>
<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let D=null;
function norm(s){const d=s.match(/\d+/g)||[];if(d.length==1&&(d[0].length==4||d[0].length==8))return d[0].slice(0,4);
 if(d.length>=2){const g=+d[0],m=+d[1];if(g<1||g>31||m<1||m>12)return null;return d[0].padStart(2,'0')+d[1].padStart(2,'0')}return null}
function say(t,c){$('m').textContent=t;$('m').className='msg '+(c||'')}
async function keyFor(n,code){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.sali[n]),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function dec(vid,e,key){const r=await fetch('v/'+vid+'/'+e.f+'.bin');if(!r.ok)throw new Error('net');
 return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},key,await r.arrayBuffer())}
if(location.protocol==='file:')say('Questa pagina funziona solo online: aprila dall\'indirizzo del sito, non dal file sul computer.','err');
fetch('valutazioni.json').then(r=>r.json()).then(d=>{D=d;d.studenti.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('n').appendChild(o)})})
 .catch(()=>say('Non riesco a caricare le valutazioni. Riprova tra poco.','err'));
$('f').addEventListener('submit',async ev=>{ev.preventDefault();
 const n=$('n').value,code=norm($('c').value);
 if(!n){say('Scegli il tuo numero di registro.','err');return}
 if(!code){say('Scrivi giorno e mese come gg/mm.','err');return}
 const mine=D.valutazioni.filter(v=>v.file[n]);
 $('b').disabled=true;say('Apertura in corso…');
 try{const items=[];let wrong=false;const key=mine.length?await keyFor(n,code):null;
  for(const v of mine){try{const pt=await dec(v.id,v.file[n],key);items.push({v,url:URL.createObjectURL(new Blob([pt],{type:'application/pdf'}))})}catch(e){if(e.message==='net')throw e;wrong=true;break}}
  if(wrong){say('Codice non corretto: controlla numero, giorno e mese di nascita.','err');return}
  $('ul').innerHTML='';
  items.forEach(({v,url})=>{const li=document.createElement('li');const s=document.createElement('span');s.textContent=v.titolo;
   const a=document.createElement('a');a.href=url;a.download='valutazione_'+v.id+'_n'+String(n).padStart(2,'0')+'.pdf';a.textContent='Scarica PDF';li.append(s,a);$('ul').appendChild(li)});
  $('none').hidden=items.length>0;$('lt').textContent='Studente n. '+n+': le tue valutazioni';
  $('login').hidden=true;$('list').hidden=false;say('');
 }catch(_){say('Non riesco a caricare i file. Riprova tra poco.','err')}finally{$('b').disabled=false}});
$('out').addEventListener('click',()=>{$('ul').querySelectorAll('a').forEach(a=>URL.revokeObjectURL(a.href));$('c').value='';$('list').hidden=true;$('login').hidden=false});
</script>
</body>
</html>
